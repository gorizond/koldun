# Local development values for Rancher Desktop
image:
  repository: koldun
  tag: dev
  pullPolicy: Never

# Enable NATS subchart
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 1Gi
    cluster:
      enabled: false

# MinIO subchart. Disabled here because credentials must never be committed:
# hack/dev-values.sh generates a temporary values file with random credentials
# and enables MinIO + the CSI S3 driver.
#   helm install koldun charts/koldun -n koldun \
#     -f values-dev.yaml -f "$(hack/dev-values.sh)" --wait
minio:
  enabled: false
  mode: standalone
  replicas: 1
  persistence:
    enabled: false  # Disable persistence for local dev
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  buckets:
    - name: koldun-models
      policy: none
      purge: false

# Configure operator to use subchart services
operator:
  conversation:
    natsUrl: "nats://koldun-nats:4222"
    kvBucket: "koldun_ttl"
    ttlPrefix: "nats_ttl_"
    pollInterval: 10s
  registry:
    modelsBucket: "koldun_models"
    tokensBucket: "koldun_tokens"
    modelPrefix: "model/"
    tokenPrefix: "token/"
  health:
    port: 8080

# CSI S3 driver for model conversion. Enabled (with credentials) by
# hack/dev-values.sh; the credentials live under csi-s3.secret.*.
csi-s3:
  enabled: false
  storageClass:
    name: csi-s3
    singleBucket: koldun-models
    mounter: geesefs
