apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    objectset.rio.cattle.io/id: ingress-public-backend
    objectset.rio.cattle.io/owner-gvk: koldun.gorizond.io/v1, Kind=Ingress
    objectset.rio.cattle.io/owner-name: public-backend
    objectset.rio.cattle.io/owner-namespace: default
  labels:
    koldun.gorizond.io/backend: public-backend
    koldun.gorizond.io/component: backend
  name: public-backend-backend
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      koldun.gorizond.io/backend: public-backend
      koldun.gorizond.io/component: backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        koldun.gorizond.io/backend: public-backend
        koldun.gorizond.io/component: backend
    spec:
      containers:
        - args:
            - '--mode=backend'
            - '--backend-listen=:8082'
            - '--backend-namespace=$(POD_NAMESPACE)'
            - '--backend-root-image=ghcr.io/gorizond/koldun-root:latest'
            - '--backend-worker-image=ghcr.io/gorizond/koldun-worker:latest'
            - '--backend-nats-url=nats://koldun:k0ldun@nats.default:4222'
            - '--backend-conversation-bucket=koldun_ttl'
            - '--backend-models-bucket=koldun_models'
            - '--backend-tokens-bucket=koldun_tokens'
            - '--backend-model-prefix=model/'
            - '--backend-token-prefix=token/'
            - '--backend-ttl-prefix=nats_ttl_'
            - '--backend-conversation-ttl=10m0s'
            - '--backend-response-timeout=2m0s'
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
          image: ghcr.io/gorizond/koldun:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: backend
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30