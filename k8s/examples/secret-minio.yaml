# MinIO Credentials Secret
# Used by Model CR for object storage access
#
# Generate strong credentials and create the secret, for example:
#   ACCESS_KEY="$(openssl rand -base64 32)"
#   SECRET_KEY="$(openssl rand -base64 32)"
#   kubectl -n koldun create secret generic minio-creds \
#     --from-literal=AWS_ACCESS_KEY_ID="${ACCESS_KEY}" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="${SECRET_KEY}"
#
# The values below are placeholders and must be replaced.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: koldun
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_WITH_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_SECRET_KEY
---
