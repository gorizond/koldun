# MinIO Credentials Secret
# Used by Model CR for object storage access
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: koldun
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
