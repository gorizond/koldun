name: CI Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "charts/koldun/fleet.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  controllers-envtest:
    name: Controllers Envtest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore envtest cache
        uses: actions/cache@v4
        with:
          path: bin/envtest
          key: ${{ runner.os }}-envtest-${{ hashFiles('go.mod', 'pkg/controllers/envtest_suite_test.go') }}
          restore-keys: |
            ${{ runner.os }}-envtest-

      - name: Run controllers envtest checklist
        run: ./hack/ci-envtest.sh

  build:
    name: Build and Push Image
    needs:
      - controllers-envtest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch

      - name: Build and push Docker image for ${{ matrix.platform }}
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-v2
          cache-to: type=gha,mode=max,scope=build-v2
