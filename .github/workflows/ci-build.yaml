name: CI Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "charts/koldun/fleet.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  controllers-envtest:
    name: Controllers Envtest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore envtest cache
        uses: actions/cache@v4
        with:
          path: bin/envtest
          key: ${{ runner.os }}-envtest-${{ hashFiles('go.mod', 'pkg/controllers/envtest_suite_test.go') }}
          restore-keys: |
            ${{ runner.os }}-envtest-

      - name: Run controllers envtest checklist
        run: ./hack/ci-envtest.sh

  build-amd64:
    name: Build AMD64 Image
    needs:
      - controllers-envtest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Publish AMD64 with main tags immediately
          tags: |
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=amd64-v0.0.${{ github.run_number }}
            type=raw,value=amd64-sha-${{ github.sha }}

      - name: Build and push AMD64 Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-v2
          cache-to: type=gha,mode=max,scope=build-v2

  build-arm64:
    name: Build ARM64 Image
    needs:
      - controllers-envtest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Build ARM64 with temporary tags
          tags: |
            type=raw,value=temp-${{ github.run_number }}-arm64
            type=raw,value=arm64-v0.0.${{ github.run_number }}
            type=raw,value=arm64-sha-${{ github.sha }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-v2
          cache-to: type=gha,mode=max,scope=build-v2

  finalize-manifest:
    name: Finalize Multi-Platform Manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest for version tag
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp-${{ github.run_number }}-arm64

      - name: Create and push multi-platform manifest for SHA tag
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp-${{ github.run_number }}-arm64

      - name: Clean up temporary images
        run: |
          docker buildx imagetools rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:temp-${{ github.run_number }}-arm64 || true

  bump-fleet-tag:
    name: Bump Fleet Image Tag
    needs: [finalize-manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Bump chart image references
        env:
          TAG: v0.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          # fleet.yaml drives the deployed image tag.
          sed -i -E "s|^([[:space:]]*tag: )v0\.0\.[0-9]+\$|\1${TAG}|" charts/koldun/fleet.yaml
          grep -qE "^[[:space:]]*tag: ${TAG}\$" charts/koldun/fleet.yaml \
            || { echo "fleet.yaml image tag was not updated to ${TAG}"; exit 1; }
          # Chart.yaml appVersion is the default tag when image.tag is empty.
          sed -i -E "s|^appVersion: .*\$|appVersion: \"${TAG}\"|" charts/koldun/Chart.yaml
          grep -qF "appVersion: \"${TAG}\"" charts/koldun/Chart.yaml \
            || { echo "Chart.yaml appVersion was not updated to ${TAG}"; exit 1; }
          # chart-releaser skips versions that already exist in the index, so
          # every release needs a fresh chart version (patch increment).
          CURRENT_VERSION=$(awk '/^version: /{print $2}' charts/koldun/Chart.yaml)
          NEW_VERSION=$(printf '%s\n' "$CURRENT_VERSION" | awk -F. 'NF == 3 { printf "%s.%s.%d", $1, $2, $3 + 1 }')
          if [ -z "$NEW_VERSION" ]; then
            echo "Chart.yaml version is not semver (major.minor.patch): ${CURRENT_VERSION}"
            exit 1
          fi
          sed -i -E "s|^version: .*\$|version: ${NEW_VERSION}|" charts/koldun/Chart.yaml
          grep -qE "^version: ${NEW_VERSION}\$" charts/koldun/Chart.yaml \
            || { echo "Chart.yaml version was not updated to ${NEW_VERSION}"; exit 1; }
          echo "Chart version ${CURRENT_VERSION} -> ${NEW_VERSION}, appVersion ${TAG}"
          if git diff --quiet -- charts/koldun/fleet.yaml charts/koldun/Chart.yaml; then
            echo "Image references already at ${TAG}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/koldun/fleet.yaml charts/koldun/Chart.yaml
          git commit -m "chore: bump koldun image to ${TAG} [skip ci]"
          git push
