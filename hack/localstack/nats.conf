server_name: koldun-local
port: 4222
http: 8222
jetstream {
  store_dir: /data/jetstream
  max_mem_store: 1Gb
  max_file_store: 10Gb
}

# Enable accounts: system for monitoring, koldun for application
accounts: {
  SYS: {
    users: [ { user: "sys", password: "sys" } ]
  }
  KOLDUN: {
    jetstream: enabled
    users: [ { user: "koldun", password: "koldun" } ]
  }
}

system_account: SYS
