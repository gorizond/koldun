# Default values for koldun.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/gorizond/koldun
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  create: true
  extraRules: []

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

operator:
  conversation:
    natsUrl: ""
    kvBucket: ""
    ttlPrefix: nats_ttl_
    pollInterval: 10s
  registry:
    modelsBucket: ""
    tokensBucket: ""
    modelPrefix: ""
    tokenPrefix: ""
  health:
    port: 8080
  extraArgs: []

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: health
readinessProbe:
  httpGet:
    path: /readyz
    port: health

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# -------------------------------------------------------------------
# Metrics and monitoring configuration
# -------------------------------------------------------------------
metrics:
  enabled: false
  serviceMonitor:
    # Labels for ServiceMonitor (add release label for Prometheus Operator)
    labels: {}
      # release: prometheus
    # Scrape interval
    interval: 30s
    # Scrape timeout
    scrapeTimeout: 10s

# -------------------------------------------------------------------
# External infrastructure configuration (when not using subcharts)
# -------------------------------------------------------------------
externalNats:
  # Use external NATS instead of subchart
  enabled: false
  url: "nats://external-nats:4222"

externalMinio:
  # Use external MinIO/S3 instead of subchart
  enabled: false
  endpoint: "external-minio:9000"
  accessKey: ""
  secretKey: ""
  bucket: "koldun-models"

# -------------------------------------------------------------------
# NATS subchart configuration
# https://nats-io.github.io/k8s/helm/charts/
# -------------------------------------------------------------------
nats:
  enabled: false
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    cluster:
      enabled: false
  # Single node setup
  container:
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

# -------------------------------------------------------------------
# MinIO subchart configuration (single node)
# https://charts.min.io/
# -------------------------------------------------------------------
minio:
  enabled: false
  mode: standalone
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  # Default credentials (override in production!)
  rootUser: "minioadmin"
  rootPassword: "minioadmin"
  buckets:
    - name: koldun-models
      policy: none
      purge: false

# -------------------------------------------------------------------
# CSI S3 driver subchart configuration
# https://github.com/yandex-cloud/k8s-csi-s3
# -------------------------------------------------------------------
csi-s3:
  enabled: false
  # S3 endpoint configuration (auto-configured when minio.enabled=true)
  storageClass:
    name: csi-s3
    singleBucket: koldun-models
    mounter: geesefs
    # Will be overridden by template if minio.enabled
    endpoint: ""
    accessKey: ""
    secretKey: ""

ingresses: []
# Pair ingress resources with the dispatcher sample manifest in k8s/dispatcher-deploy.yaml
# when running dispatcher pods manually; that manifest highlights the required
# --dispatcher-state-prefix flag, the Session.spec.queue.stateStream override behaviour,
# and the optional spec.dispatcherMetricsListen / --dispatcher-metrics-listen endpoint for /metrics + /healthz scraping.
# Common dispatcher knobs can be injected into every generated Ingress via ingressDefaults.
ingressDefaults:
  # Dispatcher metrics listener added to spec.backend.dispatcherMetricsListen when not overridden per ingress.
  dispatcherMetricsListen: ":9090"
# - name: example
#   namespace: default
#   dispatcherMetricsListen: ":9090" # override per-ingress or set to "" to disable while leaving defaults intact.
#   spec:
#     backend:
#       image: ghcr.io/gorizond/koldun:latest
#       rootImage: ghcr.io/gorizond/koldun-root:latest
