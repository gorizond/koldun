{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "koldun.fullname" . }}-test-minio"
  labels:
    {{- include "koldun.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  containers:
    - name: minio-test
      image: amazon/aws-cli:2.17.0
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Testing MinIO connection..."

          aws --endpoint-url "$MINIO_ENDPOINT" s3api list-buckets > /dev/null
          echo "MinIO is reachable"

          if aws --endpoint-url "$MINIO_ENDPOINT" s3api head-bucket --bucket koldun-models 2>/dev/null; then
            echo "koldun-models bucket exists"
          else
            echo "Creating koldun-models bucket..."
            aws --endpoint-url "$MINIO_ENDPOINT" s3api create-bucket --bucket koldun-models > /dev/null
          fi

          aws --endpoint-url "$MINIO_ENDPOINT" s3api head-bucket --bucket koldun-models
          echo "MinIO test PASSED"
      env:
        - name: MINIO_ENDPOINT
          value: "http://{{ include "koldun.minioFullname" . }}:9000"
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        # Credentials come from the MinIO secret managed by the subchart, or
        # from minio.existingSecret when the subchart is told to reuse one.
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ default (include "koldun.minioFullname" .) .Values.minio.existingSecret }}
              key: rootUser
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ default (include "koldun.minioFullname" .) .Values.minio.existingSecret }}
              key: rootPassword
  restartPolicy: Never
{{- end }}
