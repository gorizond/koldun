{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "koldun.dllamaServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "koldun.labels" . | nindent 4 }}
  {{- with .Values.dllamaServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
