apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.koldun.gorizond.io
spec:
  group: koldun.gorizond.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    singular: session
    shortNames:
      - sess
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                hash:
                  type: string
                modelRef:
                  type: object
                  properties:
                    apiGroup:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - kind
                    - name
                rootImage:
                  type: string
                workerImage:
                  type: string
                replicaPower:
                  type: integer
                  format: int32
                minIdle:
                  type: integer
                  format: int32
                maxWorkers:
                  type: integer
                  format: int32
                scaling:
                  type: object
                  properties:
                    minDllamas:
                      type: integer
                      format: int32
                    maxDllamas:
                      type: integer
                      format: int32
                    scaleUpBacklog:
                      type: integer
                      format: int32
                    scaleDownIdleSeconds:
                      type: integer
                      format: int32
                    desiredDllamas:
                      type: integer
                      format: int32
                    activeRequests:
                      type: integer
                      format: int32
                ttl:
                  type: string
                queue:
                  type: object
                  properties:
                    backlogSubject:
                      type: string
                    responseSubjectPrefix:
                      type: string
                    ackTimeout:
                      type: string
                nats:
                  type: object
                  properties:
                    url:
                      type: string
                    credentialsSecret:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
              required:
                - hash
                - modelRef
                - rootImage
                - workerImage
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                readyWorkers:
                  type: integer
                  format: int32
                busyWorkers:
                  type: integer
                  format: int32
                availableWorkers:
                  type: integer
                  format: int32
                backlog:
                  type: integer
                  format: int64
                inFlight:
                  type: integer
                  format: int64
                activeRequests:
                  type: integer
                  format: int32
                lastActivity:
                  type: string
                workers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      endpoint:
                        type: string
                      ready:
                        type: boolean
                      healthy:
                        type: boolean
                      activeMessages:
                        type: integer
                        format: int32
                      lastHeartbeat:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Hash
          type: string
          description: Session hash identifier
          jsonPath: .spec.hash
        - name: Model
          type: string
          description: Target model reference
          jsonPath: .spec.modelRef.name
        - name: ReadyWorkers
          type: integer
          jsonPath: .status.readyWorkers
        - name: Available
          type: integer
          jsonPath: .status.availableWorkers
