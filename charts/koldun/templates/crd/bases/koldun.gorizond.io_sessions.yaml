---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sessions.koldun.gorizond.io
spec:
  group: koldun.gorizond.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    shortNames:
    - sess
    singular: session
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Session models a user conversation with lifecycle and worker
          pool state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SessionSpec captures desired configuration for a conversation
              session.
            properties:
              dispatcherImage:
                description: DispatcherImage is the image that runs the per-session
                  dispatcher deployment.
                type: string
              dispatcherMetricsListen:
                description: DispatcherMetricsListen enables the dispatcher metrics
                  listener (host:port or :port form).
                type: string
              hash:
                description: Hash is the unique identifier computed from token/chat
                  metadata.
                type: string
              maxWorkers:
                description: MaxWorkers bounds the number of concurrent Dllama worker
                  sets (deprecated in favour of Scaling.MaxDllamas).
                format: int32
                type: integer
              minIdle:
                description: MinIdle enforces a minimum number of idle Dllama workers
                  kept ready (deprecated in favour of Scaling.MinDllamas).
                format: int32
                type: integer
              modelRef:
                description: ModelRef identifies the model that should serve this
                  session.
                properties:
                  apiGroup:
                    description: APIGroup optionally overrides the default API group
                      for the referenced Model resource.
                    type: string
                  kind:
                    description: Kind must be set to "Model".
                    type: string
                  name:
                    description: Name is the metadata.name of the referenced Model
                      resource.
                    type: string
                  namespace:
                    description: Namespace allows referencing a Model in another namespace.
                      Defaults to the Dllama namespace when empty.
                    type: string
                required:
                - kind
                - name
                type: object
              nats:
                description: NATS contains session specific overrides for runtime
                  connectivity.
                properties:
                  credentialsSecret:
                    description: CredentialsSecret references a Secret containing
                      connection credentials.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    type: string
                type: object
              queue:
                description: Queue defines NATS subjects/streams used for request
                  backlog.
                properties:
                  ackTimeout:
                    description: AckTimeout determines when a message lease is considered
                      expired.
                    type: string
                  assignmentsBucket:
                    description: AssignmentsBucket stores per-request dispatcher assignments
                      for idempotency.
                    type: string
                  backlogSubject:
                    description: BacklogSubject stores pending user messages.
                    type: string
                  dllamaSubjectPrefix:
                    description: DllamaSubjectPrefix prefixes per-dllama request subjects
                      (must end with '.').
                    type: string
                  responseSubjectPrefix:
                    description: ResponseSubjectPrefix prefixes per-message response
                      subjects.
                    type: string
                  stateStream:
                    description: StateStream stores worker heartbeat events for dispatcher
                      recovery.
                    type: string
                type: object
              replicaPower:
                description: ReplicaPower controls worker topology for spawned Dllamas
                  (power of two).
                format: int32
                type: integer
              rootImage:
                description: RootImage is the image used by root Dllama coordinators.
                type: string
              scaling:
                description: Scaling controls automatic creation/removal of Dllama
                  resources for the session.
                properties:
                  desiredDllamas:
                    format: int32
                    type: integer
                  maxDllamas:
                    format: int32
                    type: integer
                  minDllamas:
                    format: int32
                    type: integer
                  scaleDownIdleSeconds:
                    format: int32
                    type: integer
                  scaleUpBacklog:
                    format: int32
                    type: integer
                type: object
              ttl:
                description: TTL controls when the session and its resources should
                  be garbage collected when idle.
                type: string
              workerImage:
                description: WorkerImage is the image used by worker Dllama pods.
                type: string
            required:
            - hash
            - modelRef
            - rootImage
            - workerImage
            type: object
          status:
            description: SessionStatus reflects current backlog and worker state for
              a session.
            properties:
              activeRequests:
                format: int32
                type: integer
              availableWorkers:
                format: int32
                type: integer
              backlog:
                format: int64
                type: integer
              busyWorkers:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              inFlight:
                format: int64
                type: integer
              lastActivity:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              readyWorkers:
                format: int32
                type: integer
              workers:
                items:
                  description: SessionWorker summarises state for a Dllama worker
                    set handling the session.
                  properties:
                    activeMessages:
                      format: int32
                      type: integer
                    endpoint:
                      type: string
                    healthy:
                      type: boolean
                    lastHeartbeat:
                      format: date-time
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    ready:
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
