---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: models.koldun.gorizond.io
spec:
  group: koldun.gorizond.io
  names:
    kind: Model
    listKind: ModelList
    plural: models
    shortNames:
    - mdl
    singular: model
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Model represents the lifecycle of downloading and caching a language
          model artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelSpec holds the desired model artifact configuration.
            properties:
              conversion:
                description: Conversion optionally describes how cached artifacts
                  should be converted post-download.
                properties:
                  args:
                    description: Args provides optional arguments for the container
                      entrypoint.
                    items:
                      type: string
                    type: array
                  command:
                    description: Command overrides the container entrypoint when set.
                    items:
                      type: string
                    type: array
                  converterVersion:
                    description: 'ConverterVersion selects the distributed-llama converter
                      release tag (default: v0.16.2).'
                    type: string
                  image:
                    description: Image is the container image used for the conversion
                      Job.
                    type: string
                  memory:
                    description: Memory specifies memory limit for the conversion
                      job container.
                    type: string
                  outputPath:
                    description: OutputPath optionally overrides the cache destination
                      for converted artifacts (may be s3:// URI).
                    type: string
                  rcloneImage:
                    description: RcloneImage overrides the image used for rclone-based
                      syncing/mounting (defaults to rclone/rclone:1.67).
                    type: string
                  toolsImage:
                    description: ToolsImage overrides the image used for lightweight
                      operations (defaults to alpine:3.18).
                    type: string
                  weightsFloatType:
                    description: WeightsFloatType dictates the target precision (for
                      example, "q40").
                    type: string
                  convertWeights:
                    description: ConvertWeights selects quantization preset for convert-hf.py (e.g. "q80"); use values like "skip" to disable conversion.
                    type: string
                type: object
              download:
                description: Download contains configuration for how the model artifacts
                  are fetched and prepared.
                properties:
                  args:
                    description: Args provides optional arguments for the container
                      entrypoint.
                    items:
                      type: string
                    type: array
                  chunkMaxMiB:
                    description: ChunkMaxMiB caps multipart chunk size in MiB (defaults
                      to 64)
                    format: int32
                    type: integer
                  command:
                    description: Command overrides the container entrypoint when set.
                    items:
                      type: string
                    type: array
                  concurrency:
                    description: Concurrency sets the number of parallel parts used
                      by S3 transfer (defaults to 1)
                    format: int32
                    type: integer
                  huggingFaceTokenSecretRef:
                    description: HuggingFaceTokenSecretRef references a Secret with
                      token for private model download.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  image:
                    description: Image is the container image used for the download
                      Job.
                    type: string
                  memory:
                    description: Memory specifies memory limit for the download job
                      container (e.g. "128Mi", "1Gi").
                    type: string
                type: object
              launchOptions:
                description: LaunchOptions mirror the arguments passed to distributed-llama's
                  download sequence.
                items:
                  type: string
                type: array
              localPath:
                description: LocalPath is the path/prefix on the cache backend where
                  the artifacts will reside.
                type: string
              objectStorage:
                description: ObjectStorage describes access to object storage buckets
                  used for downloading and conversion output.
                properties:
                  bucketForConvert:
                    description: BucketForConvert stores converted artifacts generated
                      after running conversion jobs.
                    type: string
                  bucketForSource:
                    description: BucketForSource holds the original Hugging Face snapshot
                      and any downloaded artifacts.
                    type: string
                  endpoint:
                    description: Endpoint is the URL of the object storage backend
                      (e.g. S3 compatible object storage).
                    type: string
                  secretRef:
                    description: SecretRef references a Secret containing credentials
                      for the storage backend.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - bucketForConvert
                - bucketForSource
                - endpoint
                type: object
              pipProxy:
                description: PipProxy optionally sets HTTP proxy used by pip inside
                  python containers (e.g., Dragonfly dfdaemon HTTP proxy)
                type: string
              pv:
                description: PV optionally describes a template for PersistentVolume/PersistentVolumeClaim
                  used to mount S3 via CSI
                properties:
                  accessModes:
                    description: 'AccessModes for the PV, e.g. ["ReadWriteMany"] (default:
                      ["ReadWriteMany"])'
                    items:
                      type: string
                    type: array
                  capacity:
                    description: 'Capacity for the PV, e.g. "10Gi" (default: "10Gi")'
                    type: string
                  csiDriver:
                    description: 'CSIDriver name (default: "ru.yandex.s3.csi")'
                    type: string
                  csiMounter:
                    description: CSIMounter (e.g., "geesefs"), placed into volumeAttributes.mounter
                    type: string
                  csiOptions:
                    description: CSIOptions (arbitrary string passed into volumeAttributes.options)
                    type: string
                  csiSecretName:
                    description: 'CSISecretName overrides the default name of the
                      CSI secret (default: csi-s3-secret)'
                    type: string
                  csiSecretNamespace:
                    description: 'CSISecretNamespace overrides the default namespace
                      of the CSI secret (default: kube-system)'
                    type: string
                  pvcAccessModes:
                    description: 'PVCAccessModes (default: ["ReadWriteMany"])'
                    items:
                      type: string
                    type: array
                  pvcCapacity:
                    description: 'PVCCapacity request (default: same as PV Capacity
                      or "10Gi")'
                    type: string
                  pvcStorageClassName:
                    description: 'PVCStorageClassName (default: "") disables dynamic
                      provisioning for static binding'
                    type: string
                  reclaimPolicy:
                    description: 'ReclaimPolicy for the PV (default: "Retain")'
                    type: string
                  storageClassName:
                    description: 'StorageClassName for the PV (default: "csi-s3")'
                    type: string
                  volumeAttributes:
                    additionalProperties:
                      type: string
                    description: Additional volumeAttributes appended to CSI volumeAttributes
                    type: object
                type: object
              replicaPower:
                description: ReplicaPower defines the desired worker fan-out (power
                  of two) for Dllama instances referencing this model.
                format: int32
                type: integer
              sourceUrl:
                description: |-
                  SourceURL points to the upstream model source. For Hugging Face, this is the
                  repository URL like https://huggingface.co/mistralai/Mistral-7B-v0.3. The operator
                  will download all repository files into the cache backend.
                type: string
            required:
            - localPath
            - sourceUrl
            type: object
          status:
            description: ModelStatus reports whether the model artifact is ready for
              consumption.
            properties:
              artifactSizeBytes:
                description: ArtifactSizeBytes records the size of the downloaded
                  artifact, if known.
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              conversionJobName:
                description: ConversionJobName is the conversion Job associated with
                  this model generation.
                type: string
              conversionSizeBytes:
                description: ConversionSizeBytes stores the total size in bytes of
                  converted artifacts measured from the output PVC.
                format: int64
                type: integer
              conversionSizeForceToken:
                description: ConversionSizeForceToken mirrors the annotation used
                  to force a sizing rerun that produced the recorded measurement.
                type: string
              conversionSizeGeneration:
                description: ConversionSizeGeneration records the Model generation
                  for which the size measurement was produced.
                format: int64
                type: integer
              conversionSizeHuman:
                description: ConversionSizeHuman stores a human-readable representation
                  of the converted artifact size (e.g. 1.2G).
                type: string
              conversionSizeJobName:
                description: ConversionSizeJobName references the sizing Job that
                  inspects converted artifacts.
                type: string
              conversionSizeState:
                description: ConversionSizeState tracks the state of the sizing job
                  (Pending, Running, Succeeded, Failed).
                type: string
              conversionState:
                description: ConversionState mirrors DownloadState for the conversion
                  pipeline.
                type: string
              downloadJobName:
                description: DownloadJobName is the name of the Kubernetes Job responsible
                  for downloading the model.
                type: string
              downloadState:
                description: DownloadState is a high-level state for the downloader
                  pipeline (Pending, Running, Succeeded, Failed).
                type: string
              observedGeneration:
                format: int64
                type: integer
              outputPVCName:
                description: OutputPVCName is the PersistentVolumeClaim that stores
                  converted artifacts.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
