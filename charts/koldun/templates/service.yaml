apiVersion: v1
kind: Service
metadata:
  name: {{ include "koldun.fullname" . }}
  labels:
    {{- include "koldun.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "koldun.selectorLabels" . | nindent 4 }}
