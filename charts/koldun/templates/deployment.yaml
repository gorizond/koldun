apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koldun.fullname" . }}
  labels:
    {{- include "koldun.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "koldun.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "koldun.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "koldun.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--mode=operator"
            {{- if .Values.operator.conversation.natsUrl }}
            - "--operator-nats-url={{ .Values.operator.conversation.natsUrl }}"
            {{- end }}
            {{- if .Values.operator.conversation.kvBucket }}
            - "--operator-kv-bucket={{ .Values.operator.conversation.kvBucket }}"
            {{- end }}
            {{- if .Values.operator.conversation.ttlPrefix }}
            - "--operator-ttl-prefix={{ .Values.operator.conversation.ttlPrefix }}"
            {{- end }}
            {{- if .Values.operator.conversation.pollInterval }}
            - "--operator-poll-interval={{ .Values.operator.conversation.pollInterval }}"
            {{- end }}
            {{- with .Values.operator.registry }}
            {{- if .modelsBucket }}
            - "--operator-models-bucket={{ .modelsBucket }}"
            {{- end }}
            {{- if .tokensBucket }}
            - "--operator-tokens-bucket={{ .tokensBucket }}"
            {{- end }}
            {{- if .modelPrefix }}
            - "--operator-model-prefix={{ .modelPrefix }}"
            {{- end }}
            {{- if .tokenPrefix }}
            - "--operator-token-prefix={{ .tokenPrefix }}"
            {{- end }}
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
